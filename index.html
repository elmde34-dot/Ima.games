    <style>
        :root {
            --primary: #a855f7;
            --primary-dark: #6b21a8;
            --accent: #22c55e;
            --mp-blue: #009ee3;
            --bg: #030005;
            --card: #0f0a15;
            --glow: rgba(168, 85, 247, 0.4);
            --text-main: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(107, 33, 168, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(107, 33, 168, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* NAVEGACIÓN */
        nav {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            padding: 1rem 4%;
            border-bottom: 2px solid var(--primary-dark);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 15px;
        }

        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: white; text-shadow: 0 0 10px var(--glow); }
        .logo span { color: var(--primary); }

        /* CONTENEDOR DE FILTROS */
        .filter-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            order: 3;
            background: #110c1d;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #2a1f3d;
        }

        @media (min-width: 992px) {
            .filter-section { width: 65%; order: 2; flex-direction: row; align-items: center; }
        }

        .search-box { position: relative; flex-grow: 2; }
        .search-box input {
            width: 100%;
            background: #1a1525;
            border: 1px solid var(--primary-dark);
            padding: 12px 15px 12px 45px;
            border-radius: 10px;
            color: white;
            font-family: inherit;
        }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .filter-select {
            background: #1a1525;
            border: 1px solid var(--primary-dark);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            cursor: pointer;
            flex-grow: 1;
        }

        .btn-filtrar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-filtrar:hover { background: white; color: black; }

        .cart-btn-nav {
            background: var(--primary-dark);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            order: 2;
        }

        #cart-count {
            position: absolute; top: -5px; right: -5px;
            background: var(--accent); color: black; font-size: 0.8rem;
            padding: 2px 7px; border-radius: 50%; font-weight: bold;
        }

        /* GRID Y TARJETAS */
        .main-container { max-width: 1400px; margin: 0 auto; padding: 2rem 1rem; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid #2a1f3d;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .game-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            min-height: 2.5rem;
            line-height: 1.2;
        }

        .price-tag {
            background: #161122;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-top: auto;
        }
        .price { font-size: 1.5rem; font-weight: 900; color: var(--primary); }

        .add-btn {
            background: var(--primary-dark);
            color: white;
            border: none; padding: 12px; border-radius: 10px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
            text-transform: uppercase; font-size: 0.8rem;
        }
        .add-btn:hover { background: var(--accent); color: black; }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--card);
            margin: 5% auto;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            text-align: center;
        }

        .cart-list { margin: 15px 0; max-height: 300px; overflow-y: auto; text-align: left; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; font-size: 0.9rem; }

        .btn-pagar { background: var(--mp-blue); color: white; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        .wa-link { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; background: #25d366; color: black; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; }

        footer { text-align: center; padding: 3rem; color: #555; font-size: 0.8rem; }
    </style>
</head>

            { n: "Watch Dogs Legion Gold (PS4/PS5)", b: 17300 },
            { n: "Yakuza Kiwami (PS4)", b: 16400 }
        ];

        let carrito = [];

        function calcularPrecio(base) {
            return base + (base > 13000 ? 1000 : 2000);
        }

        function actualizarPantalla() {
            const busqueda = document.getElementById('busqueda').value.toLowerCase();
            const orden = document.getElementById('ordenar').value;
            const grid = document.getElementById('grid-productos');
            
            let filtrados = catalogo.filter(item => item.n.toLowerCase().includes(busqueda));

            if (orden === "ps4") filtrados = filtrados.filter(i => i.n.includes("PS4"));
            if (orden === "ps5") filtrados = filtrados.filter(i => i.n.includes("PS5"));
            
            if (orden === "menor") filtrados.sort((a,b) => calcularPrecio(a.b) - calcularPrecio(b.b));
            if (orden === "mayor") filtrados.sort((a,b) => calcularPrecio(b.b) - calcularPrecio(a.b));

            grid.innerHTML = "";
            filtrados.forEach(item => {
                const final = calcularPrecio(item.b);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="game-title">${item.n}</div>
                    <div class="price-tag"><span class="price">$${final.toLocaleString('es-AR')}</span></div>
                    <button class="add-btn" onclick="agregarAlCarrito('${item.n}', ${final})">Agregar al Carrito</button>
                `;
                grid.appendChild(card);
            });
        }

        function agregarAlCarrito(n, p) {
            carrito.push({ n, p });
            document.getElementById('cart-count').innerText = carrito.length;
        }

        function verCarrito() {
            const m = document.getElementById('cart-modal');
            const l = document.getElementById('lista-carrito');
            let t = 0;
            l.innerHTML = "";
            carrito.forEach(i => {
                t += i.p;
                l.innerHTML += `<div class="cart-item"><span>${i.n}</span> <span>$${i.p.toLocaleString('es-AR')}</span></div>`;
            });
            document.getElementById('total-modal').innerText = "Total: $" + t.toLocaleString('es-AR');
            m.style.display = "block";
        }

        function mostrarPago() { 
            if (carrito.length === 0) return;
            cerrarModal('cart-modal'); 
            document.getElementById('payment-modal').style.display = "block"; 
        }

        function cerrarModal(id) { document.getElementById(id).style.display = "none"; }

        // Carga inicial
        actualizarPantalla();
