<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMA GAMES - Catálogo Completo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --principal: #6a0dad; 
            --oscuro: #0f0f0f; 
            --texto: #ffffff;
            --acento: #a020f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--oscuro);
            color: var(--texto);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--principal);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--principal);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .search-container {
            margin-top: 15px;
        }

        #buscador {
            padding: 12px;
            width: 80%;
            max-width: 500px;
            border-radius: 25px;
            border: 2px solid var(--principal);
            background: #1a1a1a;
            color: white;
            outline: none;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .section-title {
            color: var(--principal);
            border-left: 5px solid var(--principal);
            padding-left: 15px;
            margin: 40px 0 20px 0;
        }

       /* Esto fuerza a que siempre haya varias columnas, incluso en celu */
.grid-productos {
    display: grid;
    /* Usamos 140px como mínimo para que entren al menos 2 o 3 columnas en el celu */
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
    gap: 10px;
    padding: 10px;
}

/* Ajustes para las tarjetas en pantallas chicas */
@media (max-width: 600px) {
    .card {
        padding: 10px;
    }
    .card h3 {
        font-size: 0.8rem; /* Texto más chico para que no ocupe tanto espacio */
        height: 40px;
    }
    .precio {
        font-size: 1.1rem;
    }
    .btn-add {
        padding: 8px;
        font-size: 0.8rem;
    }
    .logo {
        font-size: 1.5rem;
    }
}

/* Ajuste del Carrito para que no tape toda la pantalla en el celu */
.modal-content {
    background: #111;
    margin: 10% auto;
    padding: 15px;
    width: 90%;
    max-width: 400px;
    border-radius: 10px;
    border: 2px solid var(--principal);
}

        .card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: scale(1.02);
            border-color: var(--principal);
            box-shadow: 0 0 15px rgba(106, 13, 173, 0.3);
        }

        .card h3 {
            font-size: 0.95rem;
            height: 45px;
            overflow: hidden;
            margin: 10px 0;
        }

        .precio {
            font-size: 1.3rem;
            color: var(--acento);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .btn-add {
            background-color: var(--principal);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add:hover { background-color: #8a2be2; }

        .cart-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--principal);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            z-index: 3000;
        }

        #cart-count {
            position: absolute;
            top: 0;
            right: 0;
            background: #ff0000;
            font-size: 13px;
            padding: 3px 7px;
            border-radius: 50%;
        }

        #modal-cart {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 4000;
        }

        .modal-content {
            background: #111;
            margin: 2% auto;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            border: 2px solid var(--principal);
            max-height: 85vh;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding: 12px 0;
        }

        .btn-finalizar {
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    color: white;
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 8px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

        .metodo-pago {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #00d4ff;
        }
    </style>
</head>
<body>

    const plusBase = [
        ["PS Plus Essential - 1 MES (Español)", 12500], ["PS Plus Essential - 3 MESES (Español)", 25000], ["PS Plus Essential - 12 MESES (Español)", 65000],
        ["PS Plus Essential - 3 MESES (Aleatorio)", 20000], ["PS Plus Essential - 12 MESES (Aleatorio)", 45000],

        ["PS Plus Deluxe - 3 MESES (Aleatorio)", 40000], ["PS Plus Deluxe - 12 MESES (Aleatorio)", 85000]
    ];

    let carrito = [];

    function procesarPrecio(precio) {
        return precio >= 10000 ? precio + 1000 : precio + 1500;
    }

    function renderizar() {
        const contenedorJuegos = document.getElementById('lista-juegos');
        const contenedorPlus = document.getElementById('lista-plus');

        productosBase.forEach(p => {
            const final = procesarPrecio(p[1]);
            contenedorJuegos.innerHTML += `
                <div class="card" data-nombre="${p[0].toLowerCase()}">
                    <h3>${p[0]}</h3>
                    <div class="precio">$${final.toLocaleString()}</div>
                    <button class="btn-add" onclick="agregar('${p[0]}', ${final})">Agregar</button>
                </div>`;
        });

        plusBase.forEach(p => {
            const final = procesarPrecio(p[1]);
            contenedorPlus.innerHTML += `
                <div class="card" data-nombre="${p[0].toLowerCase()}">
                    <h3>${p[0]}</h3>
                    <div class="precio">$${final.toLocaleString()}</div>
                    <button class="btn-add" onclick="agregar('${p[0]}', ${final})">Agregar</button>
                </div>`;
        });
    }

    function agregar(nombre, precio) {
        carrito.push({nombre, precio});
        actualizarCarrito();
    }

    function eliminar(idx) {
        carrito.splice(idx, 1);
        actualizarCarrito();
    }

    function actualizarCarrito() {
        document.getElementById('cart-count').innerText = carrito.length;
        const cont = document.getElementById('cart-items');
        let total = 0;
        cont.innerHTML = '';
        carrito.forEach((item, i) => {
            total += item.precio;
            cont.innerHTML += `<div class="cart-item"><span>${item.nombre}</span><span>$${item.precio.toLocaleString()} <button onclick="eliminar(${i})" style="background:none; border:none; color:red; cursor:pointer; margin-left:10px;">&times;</button></span></div>`;
        });
        document.getElementById('cart-total').innerText = `$${total.toLocaleString()}`;
    }

   function toggleCart() {
    const m = document.getElementById('modal-cart');
    // Si lo mostramos, usamos flex para que se centre
    if (m.style.display === 'flex') {
        m.style.display = 'none';
    } else {
        m.style.display = 'flex';
    }
}

    function filtrar() {
        const term = document.getElementById('buscador').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            card.style.display = card.getAttribute('data-nombre').includes(term) ? 'flex' : 'none';
        });
    }
function finalizarPedido() {
    if (carrito.length === 0) return alert("El carrito está vacío");
    
    let listaStr = "";
    let total = 0;
    
    carrito.forEach(item => {
        listaStr += `- ${item.nombre} ($${item.precio.toLocaleString()})\n`;
        total += item.precio;
    });
    
    // Texto que se va a copiar al portapapeles
    const resumen = `Hola IMA GAMES, quiero comprar estos productos:\n${listaStr}\nTOTAL: $${total.toLocaleString()}\n\nYa realicé la transferencia al alias: matiascr13.`;
    
    // Copiar al portapapeles automáticamente
    navigator.clipboard.writeText(resumen).then(() => {
        alert("¡Pedido copiado! Ahora pegalo en el chat de Instagram.");
        // Abre tu Instagram (en la app o web)
        window.open(`https://www.instagram.com/ima._.games/`);
    }).catch(err => {
        console.error('Error al copiar: ', err);
        window.open(`https://www.instagram.com/ima._.games/`);
    });
}
    renderizar();
