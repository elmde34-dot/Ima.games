       <!DOCTYPE html>

    <!-- LIBRERÍAS EXTERNAS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 
           ================================================================
           SISTEMA INTEGRAL IMA GAMES v9.0 - HIGH PERFORMANCE
           DESARROLLADO PARA: ARGENTINA
           ================================================================
           ESTRUCTURA DE ESTILOS CSS AVANZADOS
           ================================================================
        */

        :root {
            --neon-purple: #a855f7;
            --deep-purple: #6b21a8;
            --neon-green: #22c55e;
            --dark-space: #05010a;
            --glass-bg: rgba(15, 10, 21, 0.98);
            --text-silver: #e2e8f0;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --shadow-glow: 0 0 20px rgba(168, 85, 247, 0.4);
            --border-glow: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* RESET DE NAVEGADOR */
        * { 
            margin: 0; padding: 0; 
            box-sizing: border-box; 
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark-space); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(var(--deep-purple), var(--neon-purple)); 
            border-radius: 10px;
        }

        body {
            background-color: var(--dark-space);
            background-image: 
                radial-gradient(circle at 10% 20%, #1a0b2e 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, #0d0515 0%, transparent 40%);
            color: var(--text-silver);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* HEADER Y NAVEGACIÓN */
        header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--deep-purple);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px 0;
            box-shadow: 0 5px 30px rgba(0,0,0,0.8);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .nav-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            text-shadow: 0 0 15px var(--neon-purple);
        }

        .brand span { color: var(--neon-purple); }

        .cart-btn {
            background: linear-gradient(45deg, var(--deep-purple), var(--neon-purple));
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            color: #fff;
            font-family: 'Orbitron';
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BUSCADOR */
        .search-area { 
            position: relative; 
            width: 100%; 
            max-width: 700px; 
            margin: 15px auto 0; 
        }
        
        #search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--deep-purple);
            padding: 15px 20px 15px 50px;
            border-radius: 25px;
            color: #fff;
            font-size: 1.1rem;
            font-family: 'Rajdhani';
        }

        .search-area i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-purple);
        }

        /* GRID DE PRODUCTOS (CONFIGURACIÓN MÓVIL A 3 COLUMNAS) */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* POR DEFECTO 3 COLUMNAS PARA MÓVIL */
            gap: 10px; /* GAP REDUCIDO PARA MÓVIL */
            padding: 30px 0;
        }

        /* AJUSTE PARA PANTALLAS GRANDES (ESCRITORIO) */
        @media (min-width: 768px) {
            .catalog-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 30px;
                padding: 60px 0;
            }
        }

        .card {
            background: var(--glass-bg);
            border: var(--border-glow);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .card { border-radius: 30px; padding: 25px; }
        }

        .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        
        .tag {
            background: rgba(168, 85, 247, 0.2);
            color: var(--neon-purple);
            font-size: 0.6rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .card h3 {
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #fff;
            font-family: 'Orbitron';
            line-height: 1.1;
            min-height: 40px;
        }

        @media (min-width: 768px) {
            .card h3 { font-size: 1.4rem; min-height: 60px; }
        }

        .price-val { 
            font-family: 'Orbitron'; 
            font-size: 1.1rem; 
            color: var(--neon-green); 
            font-weight: 900; 
        }

        @media (min-width: 768px) {
            .price-val { font-size: 1.8rem; }
        }

        .buy-btn {
            width: 100%;
            background: var(--deep-purple);
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron';
            font-weight: 800;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            .buy-btn { padding: 15px; font-size: 0.9rem; border-radius: 15px; }
        }

        .buy-btn:hover { background: var(--neon-purple); }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
        }

        .modal-box {
            background: #0a0a0a;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 30px;
            border: 2px solid var(--neon-purple);
            text-align: center;
        }

        .opt {
            background: #111;
            margin: 10px 0;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        footer {
            text-align: center;
            padding: 60px 0;
            background: #020205;
            color: #444;
            border-top: 1px solid #111;
            font-size: 0.8rem;
        }

        /* 
           ================================================================
           LÓGICA DE PROGRAMACIÓN JAVASCRIPT (SISTEMA DE CONTROL)
           ================================================================
        */
    </style>
</head>
<body>

        <div class="container">
            <div class="nav-main">

                <button class="cart-btn" onclick="showCart()">
                    <i class="fa-solid fa-cart-shopping"></i> <span id="count">0</span>
                </button>

            <div class="search-area">

        /* 
           FUNCIONES DE CÁLCULO DE PRECIO (REGLA DE NEGOCIO ARGENTINA)
           - Menos de 13k -> +2000
           - Más de 13k -> +1000
        */
        function calcPrice(base) {
            return base <= 13000 ? base + 2000 : base + 1000;
        }

        /* MOTOR DE BÚSQUEDA */
        function engineSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = DB.filter(item => 
                item.n.toLowerCase().includes(query) || 
                item.s.some(s => s.toLowerCase().includes(query))
            );
            render(filtered);
        }

        /* RENDERIZADO DE CATÁLOGO */
        function render(data = DB) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = "";
            data.forEach((game, idx) => {
                const price = game.m ? calcPrice(game.v[0].b) : calcPrice(game.b);
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="tags">${game.s.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                            <h3>${game.n}</h3>
                            <div class="price-val">$${price.toLocaleString()}</div>
                        </div>
                        <button class="buy-btn" onclick="openGame(${idx})">AGREGAR</button>
                    </div>`;
            });
        }

        /* GESTIÓN DE MODALES PARA MULTIPLATAFORMA */
        function openGame(i) {
            const g = DB[i];
            if(g.m) {
                const modal = document.getElementById('modal-ui');
                const list = document.getElementById('m-options');
                document.getElementById('m-title').innerText = g.n;
                list.innerHTML = "";
                g.v.forEach(ver => {
                    const fp = calcPrice(ver.b);
                    list.innerHTML += `
                        <div class="opt" onclick="add('${g.n} ${ver.p}')">
                            <span>${ver.p}</span>
                            <span style="color:var(--neon-green)">$${fp.toLocaleString()}</span>
                        </div>`;
                });
                modal.style.display = "flex";
            } else {
                add(g.n);
            }
        }

        /* LÓGICA DE CARRITO */
        function add(name) {
            cartCount++;
            document.getElementById('count').innerText = cartCount;
            closeUI();
            alert(`✅ Item añadido a IMA GAMES: ${name}`);
        }

        function closeUI() { document.getElementById('modal-ui').style.display = "none"; }
        function showCart() { alert(`Tienes ${cartCount} productos en tu carrito de Argentina.`); }
