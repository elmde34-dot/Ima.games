v<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMA GAMES | Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --p: #6a0dad; 
            --bg: #050505; 
            --card: #111;
            --txt: #eee;
            --accent: #a020f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--txt);
            padding-bottom: 100px;
            font-size: 14px; /* Bajé el tamaño base */
        }

        /* --- HEADER COMPACTO --- */
        header {
            background: #000;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--p);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem; /* Más chico */
            font-weight: 800;
            color: var(--p);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-info { font-size: 0.75rem; margin-top: 5px; color: #888; }
        .btn-user {
            background: none; border: 1px solid var(--p); color: #fff;
            padding: 3px 12px; border-radius: 15px; font-size: 0.7rem;
            cursor: pointer; margin-left: 8px;
        }

        /* --- BUSCADOR --- */
        .search-area { margin: 15px auto; max-width: 500px; padding: 0 10px; }
        #buscador {
            width: 100%; padding: 8px 20px; border-radius: 20px;
            border: 1px solid #333; background: #151515; color: #fff;
            outline: none; font-size: 0.9rem;
        }

        /* --- FILTROS CHICOS --- */
        .cats { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .c-btn {
            background: #111; border: 1px solid #333; color: #777;
            padding: 5px 12px; border-radius: 15px; font-size: 0.75rem;
            cursor: pointer; transition: 0.2s;
        }
        .c-btn.active { background: var(--p); color: #fff; border-color: var(--p); }

        /* --- GRID COMPACTA --- */
        .container { max-width: 1100px; margin: 0 auto; padding: 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); /* Tarjetas más chicas */
            gap: 15px;
        }

        .card {
            background: var(--card); border-radius: 10px; padding: 12px;
            text-align: center; border: 1px solid #222; transition: 0.3s;
            display: flex; flex-direction: column;
        }
        .card:hover { border-color: var(--p); transform: translateY(-3px); }
        .card h3 { font-size: 0.85rem; margin: 8px 0; height: 34px; overflow: hidden; line-height: 1.2; }
        .card .stars { color: #ffd700; font-size: 0.6rem; margin-bottom: 5px; }
        .card .price { font-size: 1.1rem; color: var(--accent); font-weight: bold; margin-bottom: 10px; }
        
        .btn-add {
            background: var(--p); color: #fff; border: none; padding: 7px;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.75rem;
        }

        /* --- MODALES --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center;
        }
        .m-box {
            background: #111; width: 90%; max-width: 350px; padding: 25px;
            border-radius: 15px; border: 1px solid var(--p); text-align: center;
        }

        /* --- SECCION RESEÑAS --- */
        .rev-zone { margin: 15px 0; background: #000; border-radius: 8px; padding: 10px; border: 1px solid #222; }
        #rev-list { 
            display: none; max-height: 100px; overflow-y: auto; 
            text-align: left; font-size: 0.75rem; margin-bottom: 10px;
        }
        .rev-item { border-bottom: 1px solid #111; padding: 5px 0; color: #bbb; }
        .rev-user { color: var(--p); font-weight: bold; }
        
        .btn-toggle-rev { 
            background: none; border: 1px solid #333; color: #666; 
            width: 100%; padding: 5px; font-size: 0.7rem; border-radius: 5px; cursor: pointer;
        }

        textarea { 
            width: 100%; height: 50px; background: #111; border: 1px solid #333; 
            color: #fff; padding: 8px; font-size: 0.75rem; border-radius: 5px; resize: none;
        }

        /* --- CARRITO --- */
        .cart-btn {
            position: fixed; bottom: 20px; right: 20px; background: var(--p);
            width: 55px; height: 55px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 20px;
        }
        .badge { 
            position: absolute; top: 0; right: 0; background: red; 
            font-size: 10px; padding: 2px 6px; border-radius: 10px; 
        }

        select, input[type="email"], input[type="password"] {
            width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a;
            border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 0.8rem;
        }

        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
    </style>
</head>
<body>

<header>
    <div class="logo">IMA GAMES</div>
    <div class="nav-info">
        <span id="u-mail">Invitado</span>
        <button class="btn-user" onclick="abrirAuth()">Mi Cuenta</button>
    </div>
    <div class="search-area">
        <input type="text" id="buscador" placeholder="Buscar..." onkeyup="render()">
    </div>
    <div class="cats">
        <button class="c-btn active" onclick="filtro('all', this)">Todo</button>
        <button class="c-btn" onclick="filtro('accion', this)">Acción</button>
        <button class="c-btn" onclick="filtro('deportes', this)">Deportes</button>
        <button class="c-btn" onclick="filtro('terror', this)">Terror</button>
        <button class="c-btn" onclick="filtro('plus', this)">Plus</button>
    </div>
</header>

<div class="container">
    <div class="grid" id="grid"></div>
</div>

<div class="cart-btn" onclick="verCart()">
    <i class="fas fa-shopping-cart"></i>
    <div class="badge" id="c-count">0</div>
</div>

<div id="m-game" class="modal">
    <div class="m-box">
        <h4 id="m-n"></h4>
        <div id="m-p" style="font-size: 1.5rem; color: var(--accent); font-weight: bold; margin: 10px 0;"></div>
        
        <select id="m-cons" onchange="precioModal()">
            <option value="ps4">PlayStation 4</option>
            <option value="ps5">PlayStation 5</option>
        </select>

        <div class="rev-zone">
            <button class="btn-toggle-rev" onclick="toggleRev()">VER OPINIONES</button>
            <div id="rev-list"></div>
            <div id="rev-form"></div>
        </div>

        <button class="btn-add" style="width:100%; padding:12px;" onclick="addCart()">AÑADIR AL CARRITO</button>
        <p onclick="cerrar()" style="font-size:0.7rem; color:#444; margin-top:15px; cursor:pointer;">Cancelar</p>
    </div>
</div>

<div id="m-auth" class="modal">
    <div class="m-box">
        <h3 id="a-t">LOGIN</h3>
        <input type="email" id="e" placeholder="Correo">
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn-add" style="width:100%" onclick="login()">ENTRAR</button>
        <p onclick="swapAuth()" id="a-s" style="font-size:0.7rem; color:#888; margin-top:15px; cursor:pointer;">¿No tenés cuenta? Registrate</p>
        <p onclick="cerrar()" style="font-size:0.7rem; color:#444; margin-top:10px; cursor:pointer;">Cerrar</p>
    </div>
</div>

<div id="m-cart" class="modal">
    <div class="m-box">
        <h3>Tu Carrito</h3>
        <div id="c-list" style="text-align:left; margin:15px 0; font-size:0.8rem;"></div>
        <div id="c-total" style="font-size:1.2rem; font-weight:bold; color:var(--accent);"></div>
        <button class="btn-add" style="width:100%; margin-top:15px;" onclick="irIG()">PEDIR POR WHATSAPP/IG</button>
        <p onclick="cerrar()" style="font-size:0.7rem; color:#444; margin-top:15px; cursor:pointer;">Volver</p>
    </div>
</div>

<script>
    // --- CONFIG FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyCdA-R3B5Rf9QqNBFOsg6ZAM4X2vnNbtco",
        authDomain: "imagames-cba41.firebaseapp.com",
        projectId: "imagames-cba41",
        storageBucket: "imagames-cba41.firebasestorage.app",
        messagingSenderId: "914385204626",
        appId: "1:914385204626:web:5ad0d3b948694ee9257d4b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- CATALOGO (Aquí pones TUS juegos) ---
    const juegos = [
        { id: "rdr2", n: "Red Dead Redemption 2", p: 7500, c: "accion", t: "j" },
        { id: "fc24", n: "EA SPORTS FC 24", p: 32000, c: "deportes", t: "j" },
        { id: "gta5", n: "GTA V", p: 15000, c: "accion", t: "j" },
        { id: "f124", n: "F1 24", p: 36000, c: "deportes", t: "j" },
        { id: "re4", n: "Resident Evil 4 Remake", p: 35000, c: "terror", t: "j" },
        { id: "mk1", n: "Mortal Kombat 1", p: 45000, c: "accion", t: "j" },
        { id: "for", n: "The Forest", p: 3500, c: "terror", t: "j" },
        { id: "pl1", n: "PS Plus Essential 1 Mes", p: 12500, c: "plus", t: "s" },
        { id: "pl2", n: "PS Plus Extra 1 Mes", p: 18500, c: "plus", t: "s" },
        { id: "pl3", n: "PS Plus Deluxe 1 Mes", p: 23500, c: "plus", t: "s" }
        // Agregá los que faltan aquí siguiendo el mismo formato
    ];

    let cart = [];
    let fSel = 'all';
    let uAct = null;
    let jSel = null;
    let aMod = 'login';

    // AUTH MONITOR
    auth.onAuthStateChanged(u => {
        uAct = u;
        document.getElementById('u-mail').innerText = u ? u.email.split('@')[0] : "Invitado";
        render();
    });

    function com(p) { return p >= 10000 ? p + 1000 : p + 1500; }

    function render() {
        const grid = document.getElementById('grid');
        const b = document.getElementById('buscador').value.toLowerCase();
        grid.innerHTML = '';
        juegos.forEach(j => {
            if ((fSel === 'all' || j.c === fSel) && j.n.toLowerCase().includes(b)) {
                grid.innerHTML += `
                <div class="card">
                    <div class="stars">⭐⭐⭐⭐⭐</div>
                    <h3>${j.n}</h3>
                    <div class="price">$${com(j.p).toLocaleString()}</div>
                    <button class="btn-add" onclick="selJuego('${j.id}')">Agregar</button>
                </div>`;
            }
        });
    }

    function selJuego(id) {
        jSel = juegos.find(x => x.id === id);
        if (jSel.t === 's') {
            cart.push({ n: jSel.n, p: com(jSel.p) });
            upCart(); alert("Agregado!");
        } else {
            document.getElementById('m-n').innerText = jSel.n;
            document.getElementById('m-game').style.display = 'flex';
            document.getElementById('rev-list').style.display = 'none';
            precioModal();
            loadRev(id);
            const form = document.getElementById('rev-form');
            form.innerHTML = uAct ? `
                <textarea id="ri" placeholder="Escribí tu reseña..."></textarea>
                <button class="btn-add" style="width:100%; margin-top:5px; font-size:0.7rem;" onclick="sendRev()">Enviar Reseña</button>
            ` : `<p style="font-size:0.6rem; color:#555;">Logueate para opinar</p>`;
        }
    }

    function toggleRev() {
        const l = document.getElementById('rev-list');
        l.style.display = l.style.display === 'none' ? 'block' : 'none';
    }

    function loadRev(id) {
        const l = document.getElementById('rev-list');
        l.innerHTML = '...';
        db.collection("opiniones").where("prodId", "==", id).orderBy("fecha", "desc").limit(5).onSnapshot(s => {
            l.innerHTML = s.empty ? 'Sin reseñas.' : '';
            s.forEach(d => {
                l.innerHTML += `<div class="rev-item"><span class="rev-user">${d.data().user}:</span> ${d.data().msg}</div>`;
            });
        });
    }

    function sendRev() {
        const i = document.getElementById('ri');
        if (!i.value.trim()) return;
        db.collection("opiniones").add({
            prodId: jSel.id, user: uAct.email.split('@')[0],
            msg: i.value, fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => i.value = '');
    }

    function precioModal() {
        let p = jSel.p + (document.getElementById('m-cons').value === 'ps5' ? 1300 : 0);
        document.getElementById('m-p').innerText = `$${com(p).toLocaleString()}`;
        jSel.tmpP = com(p);
    }

    function addCart() {
        const c = document.getElementById('m-cons').value.toUpperCase();
        cart.push({ n: `${jSel.n} (${c})`, p: jSel.tmpP });
        upCart(); cerrar();
    }

    function upCart() {
        document.getElementById('c-count').innerText = cart.length;
        const l = document.getElementById('c-list');
        let t = 0; l.innerHTML = '';
        cart.forEach(i => {
            t += i.p;
            l.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${i.n}</span><span>$${i.p.toLocaleString()}</span></div>`;
        });
        document.getElementById('c-total').innerText = "Total: $" + t.toLocaleString();
    }
