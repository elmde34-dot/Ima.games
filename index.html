        let carrito = [];

        function displayItems(lista, targetId) {
            const grid = document.getElementById(targetId);
            grid.innerHTML = "";
            lista.forEach(j => {
                const aumento = (j.b > 13000) ? 1000 : 2000;
                const final = j.b + aumento;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="game-title">${j.n}</div><div class="price-tag"><span class="price">$${final.toLocaleString('es-AR')}</span></div><button class="add-btn" onclick="agregarAlCarrito('${j.n}', ${final})">Agregar al Carrito</button>`;
                grid.appendChild(card);
            });
        }

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            document.getElementById('cart-count').innerText = carrito.length;
        }

        function verCarrito() {
            const modal = document.getElementById('cart-modal');
            const lista = document.getElementById('lista-carrito');
            const totalTxt = document.getElementById('total-modal');
            lista.innerHTML = "";
            let total = 0;
            carrito.forEach(i => { total += i.precio; lista.innerHTML += `<div class="cart-item"><span>${i.nombre}</span> <span>$${i.precio.toLocaleString('es-AR')}</span></div>`; });

            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }
