<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMA GAMES | Store Oficial</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --p: #6a0dad; 
            --bg: #050505; 
            --card: #111;
            --txt: #eee;
            --accent: #a020f0;
            --gray: #444;
            --white: #ffffff;
            --ig: #E1306C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body { background-color: var(--bg); color: var(--txt); padding-bottom: 120px; font-size: 14px; }

        header {
            background: #000; padding: 15px; text-align: center; border-bottom: 2px solid var(--p);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-size: 1.8rem; font-weight: 900; color: var(--p); letter-spacing: 3px; text-transform: uppercase; }

        .nav-info { font-size: 0.8rem; color: #888; margin: 10px 0; display: flex; justify-content: center; align-items: center; gap: 10px; }

        .btn-user { background: none; border: 1px solid var(--p); color: var(--white); padding: 3px 12px; border-radius: 15px; font-size: 0.7rem; cursor: pointer; }

        .search-area { margin: 15px auto; max-width: 500px; padding: 0 10px; }
        #buscador { width: 100%; padding: 10px 20px; border-radius: 20px; border: 1px solid #222; background: #111; color: #fff; outline: none; font-size: 0.9rem; }

        .cats { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .c-btn { background: #111; border: 1px solid #333; color: #777; padding: 5px 12px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .c-btn.active { background: var(--p); color: #fff; border-color: var(--p); }

        .container { max-width: 1100px; margin: 0 auto; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }

        .card { background: var(--card); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #222; display: flex; flex-direction: column; }
        .card h3 { font-size: 0.85rem; margin: 8px 0; height: 34px; overflow: hidden; }
        .card .price { font-size: 1.1rem; color: var(--accent); font-weight: bold; margin-bottom: 10px; }
        
        .btn-add { background: var(--p); color: #fff; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .m-box { background: #0f0f0f; width: 90%; max-width: 380px; padding: 25px; border-radius: 15px; border: 1px solid var(--p); text-align: center; }

        .rev-zone { margin: 15px 0; background: #000; border-radius: 8px; padding: 12px; border: 1px solid #222; }
        #rev-list { display: none; max-height: 120px; overflow-y: auto; text-align: left; font-size: 0.75rem; margin-bottom: 10px; }
        .rev-item { border-bottom: 1px solid #111; padding: 5px 0; color: #bbb; }
        .rev-user { color: var(--p); font-weight: bold; }
        
        .btn-toggle-rev { background: none; border: 1px solid #333; color: #666; width: 100%; padding: 5px; font-size: 0.7rem; border-radius: 5px; cursor: pointer; }

        /* ESTRELLAS SELECCIONABLES */
        .star-rating { margin: 10px 0; color: #555; font-size: 1.2rem; }
        .star-rating i { cursor: pointer; transition: 0.2s; }
        .star-rating i.active { color: #ffca08; }

        textarea { width: 100%; height: 50px; background: #111; border: 1px solid #333; color: #fff; padding: 8px; font-size: 0.75rem; border-radius: 5px; resize: none; }

        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: var(--p); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; z-index: 100; }
        .help-btn { position: fixed; bottom: 20px; left: 20px; background: var(--ig); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; z-index: 100; }
        .badge { position: absolute; top: 0; right: 0; background: red; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

        select, input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 0.8rem; }

        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
    </style>
</head>
<body>

<header>
    <div class="logo">IMA GAMES</div>
    <div class="nav-info">
        <i class="fas fa-user-circle"></i> <span id="u-mail">Invitado</span>
        <button class="btn-user" onclick="abrirAuth()">Mi Cuenta</button>
    </div>
    <div class="search-area">
        <input type="text" id="buscador" placeholder="¿Qué juego buscas?" onkeyup="render()">
    </div>
    <div class="cats">
        <button class="c-btn active" onclick="filtro('all', this)">Todo</button>
        <button class="c-btn" onclick="filtro('accion', this)">Acción</button>
        <button class="c-btn" onclick="filtro('deportes', this)">Deportes</button>
        <button class="c-btn" onclick="filtro('terror', this)">Terror</button>
        <button class="c-btn" onclick="filtro('plus', this)">Plus</button>
    </div>
</header>

<div class="container">
    <div class="grid" id="grid"></div>
</div>

<div class="help-btn" onclick="irIG()">
    <i class="fab fa-instagram"></i>
</div>

<div class="cart-btn" onclick="verCart()">
    <i class="fas fa-shopping-cart"></i>
    <div class="badge" id="c-count">0</div>
</div>

<div id="m-game" class="modal">
    <div class="m-box">
        <h4 id="m-n" style="color:#fff;"></h4>
        <div id="m-p" style="font-size: 1.5rem; color: var(--accent); font-weight: bold; margin: 10px 0;"></div>
        
        <select id="m-cons" onchange="precioModal()">
            <option value="ps4">PlayStation 4</option>
            <option value="ps5">PlayStation 5</option>
        </select>

        <div class="rev-zone">
            <button class="btn-toggle-rev" onclick="toggleRev()">OPINIONES DE USUARIOS</button>
            <div id="rev-list"></div>
            <div id="rev-form"></div>
        </div>

        <button class="btn-add" style="width:100%; padding:12px;" onclick="addCart()">AÑADIR AL CARRITO</button>
        <p onclick="cerrar()" style="font-size:0.7rem; color:#444; margin-top:15px; cursor:pointer;">Cancelar</p>
    </div>
</div>

<div id="m-auth" class="modal">
    <div class="m-box">
        <h3 id="a-t">LOGIN</h3>
        <input type="email" id="e" placeholder="Correo">
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn-add" style="width:100%" onclick="ejecutarAuth()">CONFIRMAR</button>
        <p onclick="swapAuth()" id="a-s" style="font-size:0.7rem; color:#888; margin-top:15px; cursor:pointer;">¿No tenés cuenta? Registrate</p>
        <p onclick="cerrar()" style="font-size:0.7rem; color:#444; margin-top:10px; cursor:pointer;">Cerrar</p>
    </div>
</div>

<div id="m-cart" class="modal">
    <div class="m-box">
        <h3 style="color:#fff;">Tu Pedido</h3>
        <div id="c-list" style="text-align:left; margin:15px 0; font-size:0.8rem; color:#ccc;"></div>
        <div id="c-total" style="font-size:1.2rem; font-weight:bold; color:var(--accent);"></div>
        <button class="btn-add" style="width:100%; margin-top:15px; background: var(--ig);" onclick="pedirYCopiar()">PEDIR POR INSTAGRAM</button>
        <p id="msg-copy" style="font-size:0.6rem; color:var(--ig); margin-top:5px; display:none;">¡Pedido copiado! Pegalo en el chat de Instagram.</p>
        <p onclick="cerrar()" style="font-size:0.7rem; color:#444; margin-top:15px; cursor:pointer;">Volver</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCdA-R3B5Rf9QqNBFOsg6ZAM4X2vnNbtco",
        authDomain: "imagames-cba41.firebaseapp.com",
        projectId: "imagames-cba41",
        storageBucket: "imagames-cba41.firebasestorage.app",
        messagingSenderId: "914385204626",
        appId: "1:914385204626:web:5ad0d3b948694ee9257d4b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const juegos = [
        { id: "rdr2", n: "Red Dead Redemption 2", p: 7500, c: "accion", t: "j" },
        { id: "fc24", n: "EA SPORTS FC 24", p: 32000, c: "deportes", t: "j" },
        { id: "gta5", n: "GTA V", p: 15000, c: "accion", t: "j" },
        { id: "f124", n: "F1 24", p: 36000, c: "deportes", t: "j" },
        { id: "re4", n: "Resident Evil 4 Remake", p: 35000, c: "terror", t: "j" },
        { id: "mk1", n: "Mortal Kombat 1", p: 45000, c: "accion", t: "j" },
        { id: "for", n: "The Forest", p: 3500, c: "terror", t: "j" },
        { id: "gow", n: "God of War Ragnarok", p: 40000, c: "accion", t: "j" },
        { id: "pl1", n: "PS Plus Essential 1 Mes", p: 12500, c: "plus", t: "s" },
        { id: "pl2", n: "PS Plus Extra 1 Mes", p: 18500, c: "plus", t: "s" },
        { id: "pl3", n: "PS Plus Deluxe 1 Mes", p: 23500, c: "plus", t: "s" }
    ];

    let cart = [];
    let fSel = 'all';
    let uAct = null;
    let jSel = null;
    let aMod = 'login';
    let vSel = 5;

    auth.onAuthStateChanged(u => {
        uAct = u;
        document.getElementById('u-mail').innerText = u ? u.email.split('@')[0] : "Invitado";
        if(document.getElementById('grid').innerHTML === "") render();
    });

    function com(p) { return p >= 10000 ? p + 1000 : p + 1500; }

    function render() {
        const grid = document.getElementById('grid');
        const b = document.getElementById('buscador').value.toLowerCase();
        grid.innerHTML = '';
        juegos.forEach(j => {
            if ((fSel === 'all' || j.c === fSel) && j.n.toLowerCase().includes(b)) {
                grid.innerHTML += `
                <div class="card">
                    <div class="stars">⭐⭐⭐⭐⭐</div>
                    <h3>${j.n}</h3>
                    <div class="price">$${com(j.p).toLocaleString()}</div>
                    <button class="btn-add" onclick="selJuego('${j.id}')">Ver más</button>
                </div>`;
            }
        });
    }

    function selJuego(id) {
        jSel = juegos.find(x => x.id === id);
        if (jSel.t === 's') {
            cart.push({ n: jSel.n, p: com(jSel.p) });
            upCart(); alert("¡" + jSel.n + " agregado!");
        } else {
            document.getElementById('m-n').innerText = jSel.n;
            document.getElementById('m-game').style.display = 'flex';
            document.getElementById('rev-list').style.display = 'none';
            vSel = 5;
            precioModal();
            loadRev(id);
            dibujarFormRev();
        }
    }

    function votar(n) { vSel = n; dibujarFormRev(); }

    function dibujarFormRev() {
        const form = document.getElementById('rev-form');
        if (!uAct) {
            form.innerHTML = `<p style="font-size:0.6rem; color:#555; margin-top:10px;">Inicia sesión para opinar</p>`;
            return;
        }
        let estrellasHTML = '<div class="star-rating">';
        for (let i = 1; i <= 5; i++) {
            estrellasHTML += `<i class="fas fa-star ${i <= vSel ? 'active' : ''}" onclick="votar(${i})"></i>`;
        }
        estrellasHTML += '</div>';
        form.innerHTML = `${estrellasHTML}<textarea id="ri" placeholder="Escribe tu opinión..."></textarea><button class="btn-add" style="width:100%; margin-top:5px; font-size:0.7rem;" onclick="sendRev()">Enviar Reseña</button>`;
    }

    function addCart() {
        if (!jSel) return;
        const c = document.getElementById('m-cons').value.toUpperCase();
        cart.push({ n: jSel.n + " (" + c + ")", p: jSel.tmpP });
        upCart(); cerrar();
    }

    function upCart() {
        document.getElementById('c-count').innerText = cart.length;
        const list = document.getElementById('c-list');
        let total = 0; list.innerHTML = '';
        cart.forEach(item => {
            total += item.p;
            list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${item.n}</span><span>$${item.p.toLocaleString()}</span></div>`;
        });
        document.getElementById('c-total').innerText = "Total: $" + total.toLocaleString();
    }

    // FUNCIÓN PARA COPIAR DETALLE Y ABRIR INSTAGRAM
    function pedirYCopiar() {
        if (cart.length === 0) return;
        
        let textoPedido = "¡Hola IMA GAMES! Quiero comprar:\n\n";
        cart.forEach(item => {
            textoPedido += "🎮 " + item.n + " ($" + item.p.toLocaleString() + ")\n";
        });
        textoPedido += "\n💰 " + document.getElementById('c-total').innerText;
        textoPedido += "\n\n¿Me pasan los datos para pagar?";

        navigator.clipboard.writeText(textoPedido).then(() => {
            document.getElementById('msg-copy').style.display = 'block';
            setTimeout(() => {
                window.open("https://www.instagram.com/ima._.games/");
            }, 1000);
        });
    }

    function precioModal() {
        if (!jSel) return;
        let pBase = jSel.p + (document.getElementById('m-cons').value === 'ps5' ? 1300 : 0);
        jSel.tmpP = com(pBase);
        document.getElementById('m-p').innerText = "$" + jSel.tmpP.toLocaleString();
    }

    function loadRev(id) {
        const l = document.getElementById('rev-list');
        l.innerHTML = '<p style="font-size:0.6rem;">Cargando...</p>';
        db.collection("opiniones").where("prodId", "==", id).onSnapshot(s => {
            l.innerHTML = s.empty ? '<p style="font-size:0.6rem; color:#444;">No hay reseñas.</p>' : '';
            const docs = [];
            s.forEach(d => docs.push(d.data()));
            docs.sort((a,b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));
            docs.forEach(data => {
                let sHTML = '';
                for(let i=1; i<=5; i++) sHTML += `<i class="fas fa-star" style="color:${i <= (data.votos || 5) ? '#ffca08' : '#333'}; font-size:0.6rem;"></i>`;
                l.innerHTML += `<div class="rev-item">${sHTML}<br><span class="rev-user">${data.user}:</span> ${data.msg}</div>`;
            });
        });
    }

    function sendRev() {
        const i = document.getElementById('ri');
        if (!i.value.trim() || !uAct) return;
        db.collection("opiniones").add({
            prodId: jSel.id,
            user: uAct.email.split('@')[0],
            msg: i.value.trim(),
            votos: vSel,
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => { i.value = ''; alert("Reseña enviada!"); });
    }

    function toggleRev() { const l = document.getElementById('rev-list'); l.style.display = l.style.display === 'none' ? 'block' : 'none'; }
    function filtro(c, btn) { fSel = c; document.querySelectorAll('.c-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
    function abrirAuth() { if (uAct) auth.signOut(); else document.getElementById('m-auth').style.display = 'flex'; }
    function swapAuth() { aMod = (aMod === 'login') ? 'reg' : 'login'; document.getElementById('a-t').innerText = aMod === 'login' ? 'LOGIN' : 'REGISTRO'; }
    function ejecutarAuth() {
        const email = document.getElementById('e').value; const password = document.getElementById('pass').value;
        if (aMod === 'login') auth.signInWithEmailAndPassword(email, password).then(() => cerrar()).catch(e => alert(e.message));
        else auth.createUserWithEmailAndPassword(email, password).then(() => cerrar()).catch(e => alert(e.message));
    }
    function verCart() { document.getElementById('m-cart').style.display = 'flex'; }
    function cerrar() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); document.getElementById('msg-copy').style.display = 'none'; }
    function irIG() { window.open("https://www.instagram.com/ima._.games/"); }
    render();
</script>
</body>
</html>
