            background-image:

            padding: 1rem 5%;
            border-bottom: 2px solid var(--primary-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px var(--glow);
        }

        .logo span { color: var(--primary); }

        .search-box { position: relative; width: 40%; }
        .search-box input {
            width: 100%;
            background: #1a1525;
            border: 1px solid var(--primary-dark);
            padding: 10px 15px 10px 45px;
            border-radius: 8px;
            color: white;
            font-family: inherit;
        }

        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .cart-btn-nav {
            background: var(--primary-dark);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
        }

        #cart-count {
            position: absolute; top: -5px; right: -5px;
            background: var(--accent); color: black; font-size: 0.7rem;
            padding: 2px 6px; border-radius: 50%; font-weight: bold;
        }

        /* TITULOS DE SECCION */
        .section-title {
            text-align: center;
            margin: 40px 0 20px;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* GRID Y CARDS */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        #grid-juegos, #grid-plus {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .card {
            background: var(--card);
            border: 1px solid #2a1f3d;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: 0.4s;
            position: relative;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 1rem 0;
            min-height: 3.5rem;
            color: #fff;
        }

        .price-tag {
            background: #161122;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .price { font-size: 1.8rem; font-weight: 900; color: var(--primary); }

        .add-btn {
            background: var(--primary-dark);
            color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-weight: bold; text-transform: uppercase; cursor: pointer;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);

            width: 90%;
            max-width: 500px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            text-align: center;

        function displayItems(lista, targetId) {
            const grid = document.getElementById(targetId);

            lista.forEach(j => {

                const final = j.b + aumento;
                const card = document.createElement('div');

            const lista = document.getElementById('lista-carrito');
            const totalTxt = document.getElementById('total-modal');
            lista.innerHTML = "";
            let total = 0;
            carrito.forEach(i => {

            totalTxt.innerText = "Total: $" + total.toLocaleString('es-AR');
