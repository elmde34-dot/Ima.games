        let cartCount = 0;

        /* 
           REGLA DE CÁLCULO DE PRECIOS IMA GAMES
           - Si el precio base es menor o igual a 13000, se suma 2000.
           - Si el precio base es mayor a 13000, se suma 1000.
        */
        function calcPrice(base) {
            if (base <= 13000) {
                return base + 2000;
            } else {
                return base + 1000;
            }
        }

        /* 
           MOTOR DE BÚSQUEDA INTEGRAL
           - Búsqueda por Nombre exacto o parcial.
           - Búsqueda por Sección (Deportes, RPG, etc).
           - Búsqueda por valor numérico de precio.
        */
        function engineSearch() {
            const input = document.getElementById('search-input');
            const query = input.value.toLowerCase();
            const filtered = DB.filter(item => {
                const finalP = item.m ? calcPrice(item.v[0].b) : calcPrice(item.b);
                const matchName = item.n.toLowerCase().includes(query);
                const matchTags = item.s.some(tag => tag.toLowerCase().includes(query));
                const matchPrice = finalP.toString().includes(query);
                
                return matchName || matchTags || matchPrice;
            });
            renderCatalog(filtered);
        }

        /* 
           SISTEMA DE RENDERIZADO DINÁMICO
           Genera las tarjetas de producto basadas en los datos filtrados.
        */
        function renderCatalog(data = DB) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = "";
            
            data.forEach((game, index) => {
                const finalPrice = game.m ? calcPrice(game.v[0].b) : calcPrice(game.b);
                const tagElements = game.s.map(t => `<span class="tag">${t}</span>`).join('');
                
                const cardHtml = `
                    <div class="card">
                        <div class="card-top">
                            <div class="tags">${tagElements}</div>
                            <h3>${game.n}</h3>
                            <div class="price-box">
                                <span class="price-label">Valor Final ARS</span>
                                <div class="price-val">$${finalPrice.toLocaleString()}</div>
                            </div>
                        </div>
                        <button class="buy-btn" onclick="openGameModal(${index})">
                            <i class="fa-solid fa-plus"></i> AGREGAR AL CARRITO
                        </button>
                    </div>`;
                grid.innerHTML += cardHtml;
            });
        }

        /* 
           LÓGICA DE GESTIÓN DE PRODUCTOS Y MODALES
           Maneja la apertura de detalles para juegos multiplataforma.
        */
        function openGameModal(i) {
            const game = DB[i];
            if(game.m) {
                const modal = document.getElementById('modal-ui');
                const list = document.getElementById('m-options');
                document.getElementById('m-title').innerText = game.n;
                list.innerHTML = "";
                
                game.v.forEach(ver => {
                    const price = calcPrice(ver.b);
                    list.innerHTML += `
                        <div class="opt" onclick="processPurchase('${game.n} ${ver.p}', ${price})">
                            <span class="opt-platform">${ver.p}</span>
                            <span class="opt-price">$${price.toLocaleString()}</span>
                        </div>`;
                });
                modal.style.display = "flex";
            } else {
                processPurchase(game.n, calcPrice(game.b));
            }
        }
