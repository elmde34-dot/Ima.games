<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMA GAMES | Catálogo Completo</title>
    <!-- Iconos y Tipografía -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #a855f7;
            --primary-dark: #6b21a8;
            --accent: #22c55e;
            --mp-blue: #009ee3;
            --bg: #030005;
            --card: #0f0a15;
            --glow: rgba(168, 85, 247, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(107, 33, 168, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(107, 33, 168, 0.1) 0%, transparent 40%);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* NAVBAR PROFESIONAL */
        nav {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            padding: 0.8rem 4%;
            border-bottom: 2px solid var(--primary-dark);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 10px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px var(--glow);
        }

        .logo span { color: var(--primary); }

        .search-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            order: 3;
        }

        @media (min-width: 768px) {
            .search-container { width: 55%; order: 2; flex-direction: row; }
            .logo { font-size: 1.5rem; }
        }

        .search-box { position: relative; flex-grow: 1; }
        .search-box input {
            width: 100%;
            background: #1a1525;
            border: 1px solid var(--primary-dark);
            padding: 12px 15px 12px 45px;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }

        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .filter-select {
            background: #1a1525;
            border: 1px solid var(--primary-dark);
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .cart-btn-nav {
            background: var(--primary-dark);
            color: white;
            padding: 10px 188px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            order: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .cart-btn-nav { padding: 10px 18px; }
        }

        #cart-count {
            background: var(--accent);
            color: black;
            font-size: 0.8rem;
            padding: 2px 7px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* CUERPO Y GRID */
        .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
        
        .section-title {
            text-align: center;
            margin: 30px 0 15px;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }

        @media (min-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } }

        .card {
            background: var(--card);
            border: 1px solid #2a1f3d;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .game-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0.5rem 0 1rem;
            min-height: 2.8rem;
            color: #fff;
            line-height: 1.2;
        }

        .price-tag {
            background: #161122;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .price { font-size: 1.6rem; font-weight: 900; color: var(--primary); }

        .add-btn {
            background: var(--primary-dark);
            color: white;
            border: none; padding: 14px; border-radius: 10px;
            font-weight: bold; text-transform: uppercase; cursor: pointer;
            font-size: 0.85rem;
            width: 100%;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card);
            margin: 5% auto;
            padding: 20px;
            width: 95%;
            max-width: 450px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            text-align: center;
            position: relative;
        }

        .cart-list { margin: 15px 0; max-height: 300px; overflow-y: auto; text-align: left; }
        .cart-item { font-size: 0.9rem; display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }

        .btn-pagar {
            background: var(--mp-blue);
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .payment-info {
            background: #1a1525;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px dashed var(--accent);
        }

        .wa-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            background: #25d366;
            color: black;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        footer { text-align: center; padding: 3rem 1rem; color: #666; font-size: 0.9rem; border-top: 1px solid #1a1525; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">IMA <span>GAMES</span></div>
        <div class="cart-btn-nav" onclick="verCarrito()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="busqueda" placeholder="Buscar juego o Plus...">
            </div>
            <select id="ordenar" class="filter-select" onchange="actualizarPantalla()">
                <option value="todos">Ordenar por...</option>
                <option value="menor">Precio: Menor a Mayor</option>
                <option value="mayor">Precio: Mayor a Menor</option>
                <option value="ps4">Solo PS4</option>
                <option value="ps5">Solo PS5</option>
            </select>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">Nuestros Productos</h2>
        <div id="grid-productos" class="grid"></div>
    </div>

    <!-- MODAL CARRITO -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <h2 style="font-family: 'Orbitron';">Tu Carrito</h2>
            <div id="lista-carrito" class="cart-list"></div>
            <p id="total-modal" style="font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; color: var(--accent)"></p>
            <button class="btn-pagar" onclick="mostrarPago()">PAGAR CON MERCADO PAGO</button>
            <button onclick="cerrarModal('cart-modal')" style="background: none; color: #888; border: none; margin-top: 15px; cursor: pointer;">Volver</button>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h2 style="font-family: 'Orbitron'; color: var(--mp-blue);">MERCADO PAGO</h2>
            <div class="payment-info">
                <h3>Datos de Transferencia</h3>
                <p><strong>Alias:</strong> <span style="color: #fff; background: #333; padding: 4px 8px; border-radius: 4px;">matiascr13</span></p>
                <p><strong>Titular:</strong> Matías</p>
                <a href="https://wa.me/5493704862044" target="_blank" class="wa-link">
                    <i class="fa-brands fa-whatsapp"></i> ENVIAR COMPROBANTE
                </a>
            </div>
            <button onclick="cerrarModal('payment-modal')" style="background: var(--primary-dark); color: white; border: none; padding: 14px; border-radius: 10px; margin-top: 20px; cursor: pointer; width: 100%;">ENTENDIDO</button>
        </div>
    </div>

    <footer>
        <p>© 2026 IMA GAMES - Formosa, Argentina</p>
    </footer>

    <script>
        const todoElCatalogo = [
            // PLAYSTATION PLUS
            { n: "PS Plus Essential - 1 Mes (Español) (PS4/PS5)", b: 12500 },
            { n: "PS Plus Essential - 3 Meses (Español) (PS4/PS5)", b: 25000 },
            { n: "PS Plus Essential - 12 Meses (Español) (PS4/PS5)", b: 65000 },
            { n: "PS Plus Essential - 3 Meses (Aleatorio) (PS4)", b: 20000 },
            { n: "PS Plus Essential - 12 Meses (Aleatorio) (PS4)", b: 45000 },
            { n: "PS Plus Extra - 1 Mes (Español) (PS4/PS5)", b: 18500 },
            { n: "PS Plus Extra - 3 Meses (Español) (PS4/PS5)", b: 40000 },
            { n: "PS Plus Extra - 12 Meses (Español) (PS4/PS5)", b: 113000 },
            { n: "PS Plus Extra - 3 Meses (Aleatorio) (PS4)", b: 28000 },
            { n: "PS Plus Extra - 12 Meses (Aleatorio) (PS4)", b: 65000 },
            { n: "PS Plus Deluxe - 1 Mes (Español) (PS4/PS5)", b: 23500 },
            { n: "PS Plus Deluxe - 3 Meses (Español) (PS4/PS5)", b: 55000 },
            { n: "PS Plus Deluxe - 12 Meses (Español) (PS4/PS5)", b: 125000 },
            { n: "PS Plus Deluxe - 3 Meses (Aleatorio) (PS4)", b: 40000 },
            { n: "PS Plus Deluxe - 12 Meses (Aleatorio) (PS4)", b: 85000 },
            { n: "PS5 - 13 Días Essential (Español) (PS5)", b: 7000 },
            { n: "PS4/PS5 - 15 Días Essential (Español)", b: 7500 },
            { n: "PS4/PS5 - 23 Días Essential (Español)", b: 10500 },
            { n: "PS4 - 268 Días Essential (Español) (PS4)", b: 39000 },
            { n: "PS4/PS5 - 30 Días Extra (Español)", b: 18500 },
            { n: "PS4/PS5 - 67 Días Deluxe (Español)", b: 42000 },
            { n: "PS4 - 321 Días Essential (Aleatorio) (PS4)", b: 28000 },
            { n: "PS4 - 81 Días Extra (Aleatorio) (PS4)", b: 20000 },

            // JUEGOS
            { n: "A Quiet Place: The Road Ahead (PS5)", b: 12100 },
            { n: "Age Of Empires II: Definitive Edition (PS5)", b: 28200 },
            { n: "Alan Wake 2 (PS5)", b: 20100 },
            { n: "Alan Wake Remastered (PS4/PS5)", b: 6900 },
            { n: "Alien: Isolation - The Collection (PS4)", b: 10200 },
            { n: "Assassin's Creed Odyssey Gold (PS4)", b: 22000 },
            { n: "Assassin's Creed Origins: Deluxe (PS4)", b: 13100 },
            { n: "Assassin's Creed Rogue Remastered (PS4)", b: 11100 },
            { n: "Assassin's Creed Valhalla: Deluxe (PS4/PS5)", b: 20900 },
            { n: "Batman™: Arkham Knight (PS4)", b: 8400 },
            { n: "Battlefield 4™ (PS4)", b: 8400 },
            { n: "Battlefield™ 1 (PS4)", b: 8400 },
            { n: "Battlefield™ 2042 (PS4)", b: 14500 },
            { n: "Battlefield™ 2042 (PS5)", b: 16400 },
            { n: "Battlefield™ V (PS4)", b: 14500 },
            { n: "Blasphemous (PS4)", b: 8600 },
            { n: "Bloodborne™ (PS4)", b: 12100 },
            { n: "Bully (PS4)", b: 11100 },
            { n: "Crash Bandicoot™ Quadrilogy (PS4)", b: 13300 },
            { n: "Dark Souls™ II: Scholar (PS4)", b: 20900 },
            { n: "Dark Souls™ III (PS4)", b: 30300 },
            { n: "Dark Souls™: Remastered (PS4)", b: 20900 },
            { n: "Dead By Daylight (PS4/PS5)", b: 14500 },
            { n: "Death Stranding Director’s (PS5)", b: 20900 },
            { n: "Detroit: Become Human (PS4)", b: 12100 },
            { n: "Dragon Ball Z: Kakarot (PS4/PS5)", b: 35200 },
            { n: "EA Sports FC™ 26 (PS4)", b: 30000 },
            { n: "EA Sports FC™ 26 (PS5)", b: 25000 },
            { n: "Far Cry® 6 Deluxe (PS4/PS5)", b: 9400 },
            { n: "Ghost Of Tsushima Director (PS5)", b: 30300 },
            { n: "God Of War (2018) (PS4)", b: 12100 },
            { n: "Gran Turismo® 7 (PS4/PS5)", b: 39600 },
            { n: "Hollow Knight: Silksong (PS4/PS5)", b: 18300 },
            { n: "Horizon Zero Dawn Complete (PS4)", b: 20900 },
            { n: "Mortal Kombat: Legacy (PS4/PS5)", b: 35200 },
            { n: "Resident Evil 4 Gold (PS4/PS5)", b: 20900 },
            { n: "Resident Evil Village (PS4/PS5)", b: 17300 },
            { n: "Silent Hill 2 (PS5)", b: 39600 },
            { n: "Spider-Man Miles Morales (PS5)", b: 32600 },
            { n: "TLOU Part II (PS4)", b: 30300 },
            { n: "UFC™ 5 (PS5)", b: 17300 },
            { n: "Watch Dogs Legion Gold (PS4/PS5)", b: 17300 },
            { n: "Yakuza Kiwami (PS4)", b: 16400 }
        ];

        let carrito = [];

        function calcularPrecio(base) {
            const aumento = (base > 13000) ? 1000 : 2000;
            return base + aumento;
        }

        function actualizarPantalla() {
            const busqueda = document.getElementById('busqueda').value.toLowerCase();
            const orden = document.getElementById('ordenar').value;
            const grid = document.getElementById('grid-productos');
            
            let filtrados = todoElCatalogo.filter(item => item.n.toLowerCase().includes(busqueda));

            // Filtros de Consola
            if (orden === "ps4") {
                filtrados = filtrados.filter(item => item.n.toUpperCase().includes("PS4"));
            } else if (orden === "ps5") {
                filtrados = filtrados.filter(item => item.n.toUpperCase().includes("PS5"));
            }

            // Orden de Precio
            if (orden === "menor") {
                filtrados.sort((a, b) => calcularPrecio(a.b) - calcularPrecio(b.b));
            } else if (orden === "mayor") {
                filtrados.sort((a, b) => calcularPrecio(b.b) - calcularPrecio(a.b));
            }

            grid.innerHTML = "";
            filtrados.forEach(item => {
                const final = calcularPrecio(item.b);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="game-title">${item.n}</div>
                    <div class="price-tag"><span class="price">$${final.toLocaleString('es-AR')}</span></div>
                    <button class="add-btn" onclick="agregarAlCarrito('${item.n}', ${final})">Agregar al Carrito</button>
                `;
                grid.appendChild(card);
            });
        }

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            document.getElementById('cart-count').innerText = carrito.length;
        }

        function verCarrito() {
            const modal = document.getElementById('cart-modal');
            const lista = document.getElementById('lista-carrito');
            const totalTxt = document.getElementById('total-modal');
            lista.innerHTML = "";
            let total = 0;
            carrito.forEach(i => {
                total += i.precio;
                lista.innerHTML += `<div class="cart-item"><span>${i.nombre}</span> <span>$${i.precio.toLocaleString('es-AR')}</span></div>`;
            });
            totalTxt.innerText = "Total: $" + total.toLocaleString('es-AR');
            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function mostrarPago() {
            if (carrito.length === 0) return;
            cerrarModal('cart-modal');
            document.getElementById('payment-modal').style.display = "block";
        }

        function cerrarModal(id) { 
            document.getElementById(id).style.display = "none"; 
            document.body.style.overflow = "auto";
        }

        document.getElementById('busqueda').addEventListener('input', actualizarPantalla);
        
        // Carga inicial
        actualizarPantalla();
    </script>
</body>
</html>
