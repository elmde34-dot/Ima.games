<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMA GAMES | Store Oficial 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --secondary: #6b21a8;
            --accent: #22c55e;
            --bg-dark: #05010a;
            --card-bg: #0f0a15;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        /* RESET GENERAL */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top center, #1a0b2e 0%, var(--bg-dark) 70%);
            color: var(--text-light);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* HEADER RESPONSIVO */
        header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 10px 12px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
        }
        .logo span { color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--secondary);
            padding: 12px 15px 12px 40px;
            border-radius: 12px;
            color: white;
            font-family: 'Rajdhani';
            font-size: 1rem;
            outline: none;
        }

        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron';
            font-size: 0.75rem;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 40px 15px 20px;
        }
        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 5px;
            background: linear-gradient(to bottom, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: var(--primary);
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* GRID SISTEMA MÓVIL (2 columnas) */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .catalog-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
            .nav-container { flex-direction: row; justify-content: space-between; }
            .search-wrapper { max-width: 450px; }
            .hero h1 { font-size: 4rem; }
        }

        @media (min-width: 1024px) {
            .catalog-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* CARD DE PRODUCTO */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .badge-ps5 {
            position: absolute;
            top: 10px; right: 10px;
            background: #00439c;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
            font-family: 'Orbitron';
        }

        .game-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            min-height: 2.4rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 8px 0;
            line-height: 1.2;
        }

        .price-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            margin-top: auto;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .price-box small {
            display: block;
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .price-val {
            font-family: 'Orbitron';
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 900;
        }

        .buy-btn {
            width: 100%;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: 700;
            font-size: 0.7rem;
            font-family: 'Orbitron';
            cursor: pointer;
        }

        /* MODAL CARRITO */
        .cart-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 450px;
            margin: 10% auto;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--primary);
            max-height: 80vh;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .checkout-btn {
            width: 100%;
            background: #25d366;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 20px;
            border: none;
            font-family: 'Orbitron';
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.4;
            font-size: 0.8rem;
        }
    </style>
</head>

            ["Zombie Army Trilogy", 9800]

        let cart = [];

        // REGLA DE NEGOCIO: +2000 SI ES <= 13000 | +1000 SI ES > 13000
        function getFinalPrice(base) {
            return base + (base <= 13000 ? 2000 : 1000);
        }

        function renderGames(filter = "") {
            const container = document.getElementById('container');
            container.innerHTML = "";
            
            const filtered = rawGames.filter(g => g[0].toLowerCase().includes(filter.toLowerCase()));

            filtered.forEach(game => {
                const final = getFinalPrice(game[1]);
                const isPS5 = game[0].includes("(PS5)");
                
                container.innerHTML += `
                    <div class="card">
                        ${isPS5 ? '<div class="badge-ps5">PS5</div>' : ''}
                        <div class="game-name">${game[0]}</div>
                        <div class="price-box">
                            <small>Precio Final Primaria</small>
                            <div class="price-val">$${final.toLocaleString('es-AR')}</div>
                        </div>
                        <button class="buy-btn" onclick="addToCart('${game[0]}', ${final})">AGREGAR</button>
                    </div>`;
            });
        }

        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('count').innerText = cart.length;
            
            // Efecto visual rápido
            const btn = event.target;
            btn.innerText = "¡AGREGADO!";
            btn.style.background = "var(--accent)";
            setTimeout(() => {
                btn.innerText = "AGREGAR";
                btn.style.background = "var(--secondary)";
            }, 700);
        }

        function toggleCart(show) {
            const modal = document.getElementById('cartModal');
            modal.style.display = show ? 'block' : 'none';
            if(show) {
                const list = document.getElementById('cartList');
                let total = 0;
                list.innerHTML = "";
                cart.forEach((item, index) => {
                    total += item.price;
                    list.innerHTML += `
                        <div class="cart-item">
                            <span style="font-size:0.8rem; max-width:70%">${item.name}</span>
                            <div style="display:flex; align-items:center; gap:10px">
                                <span style="font-weight:bold; color:var(--accent)">$${item.price.toLocaleString()}</span>
                                <i class="fa-solid fa-trash" style="color:red; cursor:pointer" onclick="removeItem(${index})"></i>
                            </div>
                        </div>`;
                });
                document.getElementById('total').innerText = "$" + total.toLocaleString('es-AR');
            }
        }

        function removeItem(index) {
            cart.splice(index, 1);
            document.getElementById('count').innerText = cart.length;
            toggleCart(true);
        }

        function filterGames() {
            const val = document.getElementById('search').value;
            renderGames(val);
        }

        function sendWhatsApp() {
            if(cart.length === 0) return alert("El carrito está vacío");
            let message = "¡Hola IMA GAMES! Quiero comprar estos juegos:\n\n";
            cart.forEach(i => message += `• ${i.name} ($${i.price.toLocaleString()})\n`);
            message += `\nTotal: ${document.getElementById('total').innerText}`;
            message += "\n\n¿Me pasan los datos para transferir?";
            
            const link = `https://wa.me/5493704862044?text=${encodeURIComponent(message)}`;
            window.location.href = link;
        }

        // INICIALIZACIÓN
        renderGames();
