           ================================================================
           SISTEMA INTEGRAL IMA GAMES v6.0

        */

        :root {
            --neon-purple: #a855f7;
            --deep-purple: #6b21a8;
            --neon-green: #22c55e;
            --dark-space: #05010a;
            --glass-bg: rgba(15, 10, 21, 0.98);
            --text-silver: #e2e8f0;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --shadow-glow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        /* PERSONALIZACIÓN DE INTERFAZ */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark-space); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(var(--deep-purple), var(--neon-purple)); 
            border-radius: 10px;
        }

        * { 
            margin: 0; padding: 0; 
            box-sizing: border-box; 
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-space);
            background-image: 
                radial-gradient(circle at 10% 20%, #1a0b2e 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, #0d0515 0%, transparent 40%);
            color: var(--text-silver);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* CABECERA DINÁMICA */
        header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--deep-purple);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 25px 0;
            box-shadow: 0 5px 30px rgba(0,0,0,0.8);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 25px;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .nav-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            letter-spacing: -1.5px;
            text-shadow: 0 0 20px var(--neon-purple);
        }

        .brand span { color: var(--neon-purple); }

        .cart-btn {
            background: linear-gradient(45deg, var(--deep-purple), var(--neon-purple));
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 28px;
            border-radius: 15px;
            color: #fff;
            font-family: 'Orbitron';
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-btn:hover { transform: translateY(-3px) scale(1.05); }

        /* BUSCADOR DE ALTO RENDIMIENTO */
        .search-area { position: relative; width: 100%; }
        
        #search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--deep-purple);
            padding: 20px 30px 20px 70px;
            border-radius: 25px;
            color: #fff;
            font-size: 1.3rem;
            font-family: 'Rajdhani';
            transition: var(--transition);
        }

        #search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--neon-purple);
            box-shadow: 0 0 35px var(--neon-purple);
        }

        .search-area i {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-purple);
            font-size: 1.8rem;
        }

        /* CATÁLOGO GRID */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
            padding: 50px 0;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 35px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-15px);
            border-color: var(--neon-purple);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }

        /* ETIQUETAS DE CATEGORÍA */
        .tags { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        
        .tag {
            background: rgba(168, 85, 247, 0.15);
            color: var(--neon-purple);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 10px;
            text-transform: uppercase;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #fff;
            min-height: 70px;
            line-height: 1.2;
        }

        .price-box { margin-bottom: 30px; border-left: 4px solid var(--neon-green); padding-left: 15px; }
        .price-label { font-size: 0.8rem; color: #666; text-transform: uppercase; }
        .price-val { 
            font-family: 'Orbitron'; 
            font-size: 2rem; 
            color: var(--neon-green); 
            font-weight: 900; 
        }

        .buy-btn {
            width: 100%;
            background: var(--deep-purple);
            border: none;
            padding: 18px;
            border-radius: 20px;
            color: #fff;
            font-family: 'Orbitron';
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .buy-btn:hover { background: var(--neon-purple); transform: scale(1.02); }

        /* VENTANA MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
        }

        .modal-box {
            background: #0a0a0a;
            width: 90%;
            max-width: 480px;
            padding: 50px;
            border-radius: 45px;
            border: 2px solid var(--neon-purple);
            text-align: center;
            animation: modalAnim 0.4s ease;
        }

        @keyframes modalAnim { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }

        .opt {
            background: rgba(255,255,255,0.03);
            margin: 15px 0;
            padding: 25px;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(168, 85, 247, 0.2);
            transition: 0.3s;
        }

        .opt:hover { border-color: var(--neon-purple); background: rgba(168, 85, 247, 0.1); }

        footer {

            background: #020205;
            color: #333;
            border-top: 1px solid #111;
        }

        footer strong { color: var(--neon-purple); font-family: 'Orbitron'; }
    </style>
</head>

        ];

        let cartCount = 0;

        // REGLA MATÍAS DE PRECIOS
        function calcPrice(base) {
            return base <= 13000 ? base + 2000 : base + 1000;
        }

        // MOTOR DE BÚSQUEDA MULTI-ETIQUETA
        function engineSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = DB.filter(item => {
                const finalP = item.m ? calcPrice(item.v[0].b) : calcPrice(item.b);
                const matchN = item.n.toLowerCase().includes(query);
                const matchS = item.s.some(s => s.toLowerCase().includes(query));
                const matchP = finalP.toString().includes(query);
                return matchN || matchS || matchP;
            });
            render(filtered);
        }

        function render(data = DB) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = "";
            data.forEach((game, idx) => {
                const price = game.m ? calcPrice(game.v[0].b) : calcPrice(game.b);
                const tagList = game.s.map(t => `<span class="tag">${t}</span>`).join('');
                
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="tags">${tagList}</div>
                            <h3>${game.n}</h3>
                            <div class="price-box">
                                <span class="price-label">Precio Final</span>
                                <div class="price-val">$${price.toLocaleString()}</div>
                            </div>
                        </div>
                        <button class="buy-btn" onclick="openGame(${idx})">COMPRAR AHORA</button>
                    </div>`;
            });
        }

        function openGame(i) {
            const g = DB[i];
            if(g.m) {
                const m = document.getElementById('modal-ui');
                const list = document.getElementById('m-options');
                document.getElementById('m-title').innerText = g.n;
                list.innerHTML = "";
                g.v.forEach(ver => {
                    const fp = calcPrice(ver.b);
                    list.innerHTML += `
                        <div class="opt" onclick="add('${g.n} ${ver.p}', ${fp})">
                            <span style="font-family:'Orbitron'; font-weight:700">${ver.p}</span>
                            <span style="color:var(--neon-green); font-weight:900">$${fp.toLocaleString()}</span>
                        </div>`;
                });
                m.style.display = "flex";
            } else {
                add(g.n, calcPrice(g.b));
            }
        }

        function add(n, p) {
            cartCount++;
            document.getElementById('count').innerText = cartCount;
            closeUI();
            alert(`✅ Producto agregado: ${n}`);
        }

        function closeUI() { document.getElementById('modal-ui').style.display = "none"; }
        function showCart() { alert(`Tu carrito en IMA GAMES tiene ${cartCount} ítems.`); }
